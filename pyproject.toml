[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tennishl"
version = "0.1.0"
description = "Automatic tennis highlight reels from a static camera (desktop reference pipeline)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "imageio-ffmpeg>=0.4.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27", "playwright>=1.45"]

[tool.setuptools.package-data]
tennishl = ["web/static/*"]

[project.scripts]
tennishl = "tennishl.cli:main"

[tool.setuptools.packages.find]
include = ["tennishl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that encode video"]
